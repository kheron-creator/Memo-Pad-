<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Listen on MemoPad · Did you get the message?</title>
<meta name="description" content="Affirmations shared from MemoPad by Progress Today. Listen and read along, no sign-up needed.">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="/favicon-64.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
<main class="lp">
  <header><img src="/logo.png" alt="Progress Today" class="lplogo"></header>
  <h1 id="lTitle">Loading…</h1>
  <div class="lch" id="lCh"></div>
  <div class="lsent" id="lSent"></div>
  <div class="lbar" id="lBar"><i id="lFill"></i></div>
  <div class="ltime"><span id="lNow">0:00</span><span id="lDur">0:00</span></div>
  <div class="lctl">
    <button id="lPrevCh" aria-label="Previous chapter"><svg viewBox="0 0 32 32" width="26" fill="#fff"><rect x="6" y="7" width="3.4" height="18" rx="1.2"/><path d="M26 7.5v17a1 1 0 0 1-1.5.9L11 16.9a1 1 0 0 1 0-1.8l13.5-8.5a1 1 0 0 1 1.5.9z"/></svg></button>
    <button id="lBack" aria-label="Back 15 seconds" class="lsk">-15</button>
    <button id="lPlay" class="lplay" aria-label="Play"></button>
    <button id="lFwd" aria-label="Forward 15 seconds" class="lsk">+15</button>
    <button id="lNextCh" aria-label="Next chapter"><svg viewBox="0 0 32 32" width="26" fill="#fff"><rect x="22.6" y="7" width="3.4" height="18" rx="1.2"/><path d="M6 7.5v17a1 1 0 0 0 1.5.9L21 16.9a1 1 0 0 0 0-1.8L7.5 6.6A1 1 0 0 0 6 7.5z"/></svg></button>
  </div>
  <section class="lchaps" id="lChaps"></section>
  <footer><b>MemoPad</b> by Progress Today · Did you get the message?<br><a href="/">Make your own on MemoPad</a></footer>
</main>
<audio id="lAudio" preload="metadata" playsinline></audio>
<script type="module" src="/src/listen.js"></script>
</body>
</html>
